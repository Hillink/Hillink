<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hillink World</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage">
    <canvas id="world" aria-label="Hillink World. Drag to pan, scroll to zoom, click to inspect." tabindex="0"></canvas>
    <div id="tooltip" class="tooltip" hidden></div>
    <header class="hud">
      <b>HILLINK <span>WORLD</span></b>
      <span id="mode" class="mode"></span>
    </header>
    <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav">Go to…</button>
    <nav id="nav" class="nav" aria-label="Camera" hidden></nav>
    <aside id="inspect" class="inspect" hidden></aside>
    <section class="sim">
      <button id="sim-toggle" class="sim-toggle" aria-expanded="false" aria-controls="sim-panel">Dev simulation</button>
      <div id="sim-panel" class="sim-panel" hidden><p>Simulated World events only. Never touches Hillink data.</p><div id="scenarios"></div></div>
    </section>
    <p id="empty" class="empty" hidden>No agents registered yet.</p>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
